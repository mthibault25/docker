services:
  sonarr:
    image: linuxserver/sonarr:5.0.0-develop
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - ./data:/config
      - /mnt/external/Media/shows:/shows #optional
      - /opt/docker/downloads:/downloads #optional
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "sonarr"
      tsdproxy.dash.icon: "sh/sonarr"